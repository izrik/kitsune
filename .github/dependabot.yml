version: 2

updates:
  # The GitHub Actions used by .github/workflows/ are the only versioned
  # dependencies this repository declares: the extension bundles no libraries,
  # and there is no package.json in git (CI installs web-ext globally). So
  # there is nothing here for the npm or pip ecosystems to watch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
